services:
  postgres:
    image: postgres:15-alpine
    container_name: economics_postgres_gold
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-adminpassword}
      POSTGRES_DB: ${DB_NAME:-economics_gold}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-economics_gold}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  pipeline:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: economics_pipeline
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-adminpassword}
      DB_NAME: ${DB_NAME:-economics_gold}
    command: sh -c "python orchestrator.py"

  dashboard:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: economics_dashboard
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-adminpassword}
      DB_NAME: ${DB_NAME:-economics_gold}
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    command: streamlit run dashboards/main_dashboard.py --server.address=0.0.0.0
    restart: always

volumes:
  postgres_data:
